[project]
name = "vault-srs-tools"
version = "0.1.0"
description = "Ongoing vault card discovery and standalone FSRS training"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6,<7",
    "tzdata>=2025.2",
    "fsrs-rs-python==0.9.3",
]

[project.optional-dependencies]
test = ["nodejs-wheel>=24,<25"]

[tool.uv]
package = false
