[project]
name = "vault-srs-migration"
version = "0.1.0"
description = "Optional Anki import, verification and legacy conversion tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "markdownify>=0.13,<2",
    "pyyaml>=6,<7",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
anki = ["anki==26.9.4", "nodejs-wheel>=24,<25"]

[tool.uv]
package = false
