[project]
name = "anki-markdown-exporter"
version = "0.1.0"
description = "Export Anki notes to round-trip-friendly Markdown through AnkiConnect"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "markdownify>=0.13,<2",
    "pyyaml>=6,<7",
    "tzdata>=2025.2",
]

[tool.uv]
package = false
